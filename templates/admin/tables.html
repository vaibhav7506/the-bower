{% extends "admin/base.html" %}{% block title %}Tables{% endblock %}{% block content %}
<div class="admin-page-heading"><div><p class="admin-kicker">Dining room</p><h1>Tables</h1></div></div>
<section class="admin-panel"><h2>Add a table</h2><form method="post" class="admin-form admin-form--grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="display_name" required></label><label>Capacity<input name="capacity" type="number" min="1" max="30" required></label><label>Section<select name="section">{% for section in sections %}<option>{{ section.value }}</option>{% endfor %}</select></label><label>Shape<select name="shape">{% for shape in shapes %}<option>{{ shape.value }}</option>{% endfor %}</select></label><label>X position<input name="x_position" type="number" min="0" max="100" step="0.5" required></label><label>Y position<input name="y_position" type="number" min="0" max="100" step="0.5" required></label><label class="admin-check"><input name="active" type="checkbox" checked> Active</label><label class="admin-check"><input name="accessible" type="checkbox"> Accessible</label><button type="submit">Add table</button></form></section>
<section class="admin-panel"><h2>Current layout</h2><div class="admin-card-grid">{% for table in tables %}<form method="post" action="{{ url_for('admin.edit_table', table_id=table.id) }}" class="admin-form admin-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="display_name" value="{{ table.display_name }}"></label><label>Capacity<input name="capacity" type="number" min="1" value="{{ table.capacity }}"></label><label>Section<select name="section">{% for section in sections %}<option {% if section == table.section %}selected{% endif %}>{{ section.value }}</option>{% endfor %}</select></label><label>Shape<select name="shape">{% for shape in shapes %}<option {% if shape == table.shape %}selected{% endif %}>{{ shape.value }}</option>{% endfor %}</select></label><label>X<input name="x_position" type="number" min="0" max="100" step="0.5" value="{{ table.x_position }}"></label><label>Y<input name="y_position" type="number" min="0" max="100" step="0.5" value="{{ table.y_position }}"></label><label class="admin-check"><input name="active" type="checkbox" {% if table.active %}checked{% endif %}> Active</label><label class="admin-check"><input name="accessible" type="checkbox" {% if table.accessible %}checked{% endif %}> Accessible</label><button>Save table</button></form>{% endfor %}</div></section>
{% endblock %}
