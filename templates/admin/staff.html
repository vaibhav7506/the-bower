{% extends "admin/base.html" %}{% block title %}Staff{% endblock %}{% block content %}
<div class="admin-page-heading"><div><p class="admin-kicker">Access</p><h1>Staff accounts</h1></div></div>
<section class="admin-panel"><h2>Add an account</h2><form method="post" class="admin-form admin-form--grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option>STAFF</option><option>ADMIN</option></select></label><label>Temporary password<input name="password" type="password" minlength="12" required></label><button>Create account</button></form></section>
<section class="admin-panel"><h2>Current team</h2><div class="admin-list">{% for user in users %}<div><strong>{{ user.name }}</strong><span>{{ user.email }}</span><small>{{ user.role.value }} · {{ 'Active' if user.active else 'Inactive' }}</small><form method="post" action="{{ url_for('admin.toggle_staff', user_id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="admin-link-button admin-link-button--dark" type="submit">{{ 'Deactivate' if user.active else 'Activate' }}</button></form></div>{% endfor %}</div></section>
{% endblock %}
